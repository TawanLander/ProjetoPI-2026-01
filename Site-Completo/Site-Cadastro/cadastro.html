<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechVita - Cadastro</title>
    <link rel="stylesheet" href="./sources/style.css">
    <link rel="icon" href="../logo.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>
<body>
    <div id="container">
        <div id="logo">
            <img src="../imgs/TechVita.png">
        </div>

        <div id="container_campos">
            <h3>CADASTRO <br></h3>
                <input type="text" id="ipt_idInst" placeholder="Identificador da Instituição" oninput="verificarCodigo()">
                <div class="erro sumir" id="erro-idInst">Erro! O Id não pertence a nenhuma instituição.</div>
                <input type="text" id="ipt_nome" placeholder="Nome" oninput="verificarNome()">

                <input type="text" id="ipt_email" placeholder="Email" oninput="verificarEmail()">
                <div class="erro sumir" id="erro-email">Erro! Verifique a digitação do email.</div>
                <button onclick="guardarValores()" id="botao">AVANÇAR</button>

                <div id="mensagem"></div><br>

                <span>Já possui uma conta? <a href="./login.html">Logar</a></span>
        </div>

</body>
</html>
<script src="./sources/script.js" defer></script>

<script>
    function guardarValores(){
        let codigo = ipt_idInst.value;
        let nome = ipt_nome.value;
        let email = ipt_email.value;

        if(!passouNome || !passouCodigo || !passouEmail) {
            mensagem.innerHTML = `Por favor preencha todos os campos!`
            return false
        }

        else{
            sessionStorage.setItem('dadosUser', JSON.stringify({
                codigo, 
                nome, 
                email
            })
        )
        }



        window.location.href = "./cadastro-pt2.html"
    }

    let identificador = 'EI$B928*%$'

const idInst = document.getElementById('ipt_idInst');
const nome = document.getElementById('ipt_nome');
const email = document.getElementById('ipt_email');
const erroEmail = document.getElementById('erro-email');
const erroIdInst = document.getElementById('erro-idInst');

let passouCodigo = false;
let passouEmail = false;
let passouNome = false;

function verificarCodigo() {
    if (idInst.value.length === 0) {
        addClass(erroIdInst, 'sumir')
        passouCodigo = false;;
    } else if (idInst.value != identificador) {
        removeClass(erroIdInst, 'sumir')
        passouCodigo = false;
    } else {
        addClass(erroIdInst, 'sumir')
        passouCodigo = true;
    }
}

function verificarEmail() {
    let emailValor = email.value;

    let partes = emailValor.split('@');
    
    if (partes.length === 2) {
        let primeiro = partes[0];
        let segundo = partes[1];
        let ponto = partes[1].indexOf('.');
        if (!emailValor.includes(' ') && 
            primeiro.length >= 1 && primeiro.length <= 64 &&
            segundo.length >= 1 && segundo.length <= 64 &&
            ponto >= 1 && ponto != segundo.length - 1) {
            addClass(erroEmail, 'sumir');

            passouEmail = true;
            return;
        } else if (emailValor.length >= 10) {
                removeClass(erroEmail, 'sumir')
                passouEmail = false
            }
        
    }

    
}

function verificarNome() {
    let nomeValor = nome.value;

    let separar = nomeValor.split(' ');

    let nomeFormatado = '';

    for (let i = 0; i < separar.length; ++i) {
        nomeFormatado += `${separar[i].slice(0, 1).toUpperCase() + separar[i].slice(1).toLowerCase()} `
    }

    if(nomeValor.length >= 3){
        passouNome = true;
    }
    else{
        passouNome = false;
    }

}

function addClass (e, ...c){
    e.classList.add(...c)
}
function removeClass (e, ...c){
    e.classList.remove(...c)
}

function addErro(e, err){
    e.innerHTML = err;
    removeClass(e, 'sumir');
}



</script>
