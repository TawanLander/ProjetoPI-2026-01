<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Pacientes</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <link rel="stylesheet" href="./sources/style-pacientes.css" />
  </head>
  <body onload="pegarDados()">
    <div class="sidebar">
      <div class="logo">
        <img src="../imgs/TechVita.png" />
      </div>
      <div class="navbar">
        <a href="../Site-Pacientes/pacientes.html">
          <div class="nav">
            <span class="material-symbols-outlined">
              line_start_arrow_notch
            </span>
            <span class="link">Voltar</span>
          </div>
        </a>
        <a href="#">
          <div class="nav">
            <span class="material-symbols-outlined"> home </span>
            <span class="link">Home</span>
          </div>
        </a>
        <a href="./../index.html">
          <div class="nav">
            <span class="material-symbols-outlined"> logout </span>
            <span class="link">Logout</span>
          </div>
        </a>
      </div>
    </div>

    <div class="container">
      <div class="card">
        <h1>Selecione a pulseira para começar!</h1>
        <select id="slct-pulseiras" onchange="verificarPulseira()">
          <option hidden selected disabled>Selecione uma Pulseira</option>
        </select>
      </div>

      <div id="info" class="info sumir">
        <h1>Cadastre o novo paciente</h1>
        <label>
          Nome:
          <input type="text" id="ipt-nome" />
        </label>
        <label>
          Gênero:
          <select id="slct-genero">
            <option>Masculino</option>
            <option>Feminino</option>
          </select>
        </label>
        <label>
          Data de Nascimento:
          <input type="date" id="ipt-dtNascimento" />
        </label>
        <button onclick="cadastrarPaciente()">Cadastrar Novo Paciente</button>
      </div>
      <div id="erro" class="erro sumir">
        <p>Erro! Pulseira já em uso!</p><br>

        <div id="dados-paciente" class="dados-paciente">
          <p><strong>Paciente vinculado:</strong></p><br>
          <p>Nome: <span id="span-nome"></span></p><br>
          <p>Gênero: <span id="span-genero"></span></p><br>
          <p>Nascimento: <span id="span-nascimento"></span></p><br>
        </div>
        <button onclick="desvincularPaciente()">Desvincular Paciente</button>
      </div>

      <div id="sucesso" class="sucesso sumir">
        <p id="msg-sucesso" style="color: green;"></p>
      </div>


    </div>
  </body>
</html>
<script src="./sources/pacientes.js" defer></script>
<script src="./sources/cadastro-pacientes.js" defer></script>
